kind = "web"
previewPath = "/"
title = "Brenscot Builder"
version = "1.0.0"
id = "artifacts/brenscot-builder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25883

[services.development]
run = "pnpm --filter @workspace/brenscot-builder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brenscot-builder", "run", "build" ]
publicDir = "artifacts/brenscot-builder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25883"
BASE_PATH = "/"
