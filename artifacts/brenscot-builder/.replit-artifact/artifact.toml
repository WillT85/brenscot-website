kind = "web"
previewPath = "/"
title = "Brenscot Builder"
version = "1.0.0"
id = "artifacts/brenscot-builder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25883

[services.development]
run = "pnpm --filter @workspace/brenscot-builder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brenscot-builder", "run", "build" ]
publicDir = "artifacts/brenscot-builder/dist/public"
serve = "static"

# Existing files (robots.txt, sitemap.xml, prerendered HTML) are served first.
# Do not catch-all to index.html — that made robots/sitemap/unknown URLs soft 404s.
[[services.production.rewrites]]
from = "/about"
to = "/about/index.html"

[[services.production.rewrites]]
from = "/about/"
to = "/about/index.html"

[[services.production.rewrites]]
from = "/process"
to = "/process/index.html"

[[services.production.rewrites]]
from = "/process/"
to = "/process/index.html"

[[services.production.rewrites]]
from = "/warehouse-builders-brisbane"
to = "/warehouse-builders-brisbane/index.html"

[[services.production.rewrites]]
from = "/warehouse-builders-brisbane/"
to = "/warehouse-builders-brisbane/index.html"

[[services.production.rewrites]]
from = "/design-and-construct-warehouse-brisbane"
to = "/design-and-construct-warehouse-brisbane/index.html"

[[services.production.rewrites]]
from = "/design-and-construct-warehouse-brisbane/"
to = "/design-and-construct-warehouse-brisbane/index.html"

[[services.production.rewrites]]
from = "/projects"
to = "/projects/index.html"

[[services.production.rewrites]]
from = "/projects/"
to = "/projects/index.html"

[[services.production.rewrites]]
from = "/partners"
to = "/partners/index.html"

[[services.production.rewrites]]
from = "/partners/"
to = "/partners/index.html"

[[services.production.rewrites]]
from = "/contact"
to = "/contact/index.html"

[[services.production.rewrites]]
from = "/contact/"
to = "/contact/index.html"

[[services.production.rewrites]]
from = "/privacy-policy"
to = "/privacy-policy/index.html"

[[services.production.rewrites]]
from = "/privacy-policy/"
to = "/privacy-policy/index.html"

[[services.production.rewrites]]
from = "/terms-conditions"
to = "/terms-conditions/index.html"

[[services.production.rewrites]]
from = "/terms-conditions/"
to = "/terms-conditions/index.html"

[[services.production.rewrites]]
from = "/projects/*"
to = "/projects/*/index.html"

[services.env]
PORT = "25883"
BASE_PATH = "/"
